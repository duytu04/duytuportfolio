<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="cool-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00f2ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Minimalist D shape (Outline) -->
  <path d="M30 30 L30 70 M30 30 C55 30 65 40 65 50 C65 60 55 70 30 70" fill="none" stroke="url(#cool-grad)" stroke-width="4" stroke-linecap="round" />
  
  <!-- Minimalist T shape (Stretched) -->
  <path d="M45 40 L80 40 M62.5 40 L62.5 75" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" />
  
  <!-- Architectural Accent -->
  <rect x="30" y="75" width="50" height="2" fill="url(#cool-grad)" opacity="0.6" />
  
  <!-- Small Terminal/Code Dot -->
  <circle cx="80" cy="40" r="3" fill="#00f2ff">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>
